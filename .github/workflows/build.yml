name: Build NeoForge 26.3
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jaycee-and-brightcore-26.3
          path: |
            brightcore/build/libs/*.jar
            jaycee/build/libs/*.jar
          if-no-files-found: error
      - name: Publish the "latest" release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Built automatically from main. Put both jars in a Minecraft 26.3 NeoForge mods folder." --prerelease
          gh release upload latest brightcore/build/libs/*.jar jaycee/build/libs/*.jar --clobber
