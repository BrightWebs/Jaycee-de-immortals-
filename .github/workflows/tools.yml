name: Fetch tools
on:
  push:
    branches: ['feature/tools']
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sSfL -o vineflower.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.10.1/vineflower-1.10.1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: vineflower
          path: vineflower.jar
          retention-days: 1
