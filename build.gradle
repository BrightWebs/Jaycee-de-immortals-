plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.107' }
version = mod_version
group = mod_group
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge { version = neo_version; runs { client { client() }; server { server() } }; mods { jaycee { sourceSet sourceSets.main } } }
repositories { mavenCentral() }
tasks.withType(ProcessResources).configureEach { def p = [mod_id:mod_id,mod_name:mod_name,mod_version:mod_version]; inputs.properties p; filesMatching('META-INF/neoforge.mods.toml') { expand p } }
tasks.register('engineTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.brightwebs.jaycee.gameplay.AbilityEngineTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn tasks.named('engineTest') }
tasks.register('skillTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.brightwebs.jaycee.gameplay.SkillMathTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn tasks.named('skillTest') }
tasks.register('divineTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.brightwebs.jaycee.gameplay.divine.DivinityModelTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn tasks.named('divineTest') }
tasks.register('statusDataTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.brightwebs.jaycee.gameplay.StatusDataTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn tasks.named('statusDataTest') }
['SkillMagicBrowserModelTest', 'SkillMagicLayoutTest'].each { suite ->
    def taskName = suite.uncapitalize()
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "com.brightwebs.jaycee.client.${suite}"
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    }
    tasks.named('check') { dependsOn tasks.named(taskName) }
}
