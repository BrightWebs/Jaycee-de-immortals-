name: Build NeoForge 1.21.1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile mod
        run: ./gradlew build --no-daemon
      - name: Verify installable mod contents
        shell: bash
        run: |
          jars=(build/libs/jaycee-*.jar)
          test "${#jars[@]}" -eq 1
          jar tf "${jars[0]}" | grep -Fx 'META-INF/neoforge.mods.toml'
          jar tf "${jars[0]}" | grep -Fx 'com/brightwebs/jaycee/JayceeMod.class'
          jar tf "${jars[0]}" | grep -Fx 'com/brightwebs/jaycee/client/JayceeClient.class'
          jar tf "${jars[0]}" | grep -Fx 'com/brightwebs/jaycee/client/JayceeScreen.class'
      - uses: actions/upload-artifact@v4
        with:
          name: jaycee-neoforge-1.21.1
          path: build/libs/jaycee-*.jar
          if-no-files-found: error
