plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

evaluationDependsOn(':brightcore')

version = jaycee_version
group = mod_group
base { archivesName = 'jaycee' }

// Minecraft 26.3 ships Java 25, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

dependencies {
    // Jaycee is built on Bright Core and can't run without it.
    implementation project(':brightcore')
}

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // Both mods load together in the dev runs.
    mods {
        jaycee { sourceSet(sourceSets.main) }
        brightcore { sourceSet(project(':brightcore').sourceSets.main) }
    }
}

tasks.withType(ProcessResources).configureEach {
    def props = [
            version                : jaycee_version,
            brightcore_version     : brightcore_version,
            neo_version            : neo_version,
            minecraft_version_range: minecraft_version_range
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
