pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'JayceeDiImmortales'

// Bright Core: the framework (abilities, player data, syncing, ability bar).
include 'brightcore'
// Jaycee: Di Immortales, the content mod. Requires Bright Core.
include 'jaycee'
